<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Shake the recruiting Magic 8 Ball for a positive interview fortune."
    />
    <meta name="theme-color" content="#01040b" />
    <title>Recruiting 8 Ball</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/build/three.module.js",
          "three/addons/": "./vendor/three/addons/"
        }
      }
    </script>
  </head>
  <body>
    <main
      class="stage"
      id="stage"
      role="button"
      tabindex="0"
      aria-label="Shake the Magic 8 Ball"
    >
      <canvas class="scene" id="scene"></canvas>

      <p class="prompt" id="prompt">
        Shake for your<br />
        <span class="accent">recruiting</span> fortune
      </p>

      <p class="visually-hidden" id="live" aria-live="polite"></p>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
